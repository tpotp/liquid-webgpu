<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LIQUID REACTOR PRO</title>
<style>
:root { --neon:#00ffcc; --bg:#050505; --panel:#0d0d0d; --accent:#ff0055; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background:var(--bg); color:#fff;
  font-family:'Segoe UI',system-ui,sans-serif;
  height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
}
#hdr {
  flex-shrink:0;
  padding:8px 14px;
  border-bottom:1px solid #1a1a1a;
  display:flex; align-items:center; gap:10px;
  background:rgba(0,0,0,.85);
}
#hdr h1 { color:var(--neon); font-size:13px; letter-spacing:3px; text-shadow:0 0 12px var(--neon); }
#hdr .info { font-size:10px; color:#555; margin-left:auto; }
#hdr .info span { color:var(--neon); }

#main { flex:1; display:flex; overflow:hidden; }

#cvwrap {
  flex:1; position:relative; background:#000;
  display:flex; align-items:center; justify-content:center;
}
#cvOut { max-width:100%; max-height:100%; display:block; }

#sidebar {
  width:180px; flex-shrink:0;
  background:var(--panel);
  border-left:1px solid #1a1a1a;
  overflow-y:auto;
  display:flex; flex-direction:column; gap:0;
}

/* móvil: sidebar abajo */
@media (max-width: 600px) {
  #main { flex-direction:column; }
  #sidebar {
    width:100%; height:140px; flex-direction:row;
    border-left:none; border-top:1px solid #1a1a1a;
    overflow-x:auto; overflow-y:hidden;
  }
}

.box {
  padding:10px;
  border-bottom:1px solid #1a1a1a;
  flex-shrink:0;
}
.bname {
  font-size:8px; letter-spacing:2px; color:#444;
  text-transform:uppercase; margin-bottom:8px;
}
.row { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.lbl { font-size:10px; color:#666; }
.val { font-size:10px; color:var(--neon); font-weight:bold; min-width:28px; text-align:right; }
input[type=range] {
  width:100%; height:3px;
  accent-color:var(--neon);
  margin-bottom:8px;
  cursor:pointer;
}

#statusBox {
  font-size:10px; padding:6px 10px;
  background:rgba(0,255,100,.06);
  border:1px solid rgba(0,255,100,.2);
  border-radius:3px; color:#00ff66;
  text-align:center; margin:8px;
}
#statusBox.err { background:rgba(255,30,30,.08); border-color:rgba(255,30,30,.2); color:#ff4455; }

.abar-wrap { height:5px; background:#111; border-radius:2px; overflow:hidden; margin-top:6px; }
#abar { height:100%; width:0; background:linear-gradient(90deg,var(--neon),var(--accent)); border-radius:2px; }

.btn {
  display:block; width:calc(100% - 20px);
  margin:0 10px 6px;
  padding:7px 6px;
  background:rgba(0,255,204,.08);
  border:1px solid rgba(0,255,204,.25);
  border-radius:4px;
  color:var(--neon); font-size:10px;
  letter-spacing:1px; cursor:pointer;
  transition:background .12s;
}
.btn:hover, .btn.on { background:rgba(0,255,204,.2); color:#fff; }
.btn.accent { border-color:var(--accent); color:var(--accent); }
.btn.accent.on { background:rgba(255,0,85,.2); }

/* indicador debug seams */
#seamOverlay {
  position:absolute; top:0; left:0; pointer-events:none;
  width:100%; height:100%;
}
</style>
</head>
<body>

<div id="hdr">
  <h1>⚡ LIQUID REACTOR PRO</h1>
  <div class="info">
    FPS: <span id="fps">0</span> &nbsp;
    W: <span id="dbgW">-</span> &nbsp;
    Seams: <span id="dbgS">0</span>
  </div>
</div>

<div id="main">
  <div id="cvwrap">
    <canvas id="cvOut"></canvas>
    <canvas id="seamOverlay"></canvas>
  </div>

  <div id="sidebar">
    <div id="statusBox">Iniciando…</div>

    <div class="box">
      <div class="bname">🎛 Deformación</div>
      <div class="row"><span class="lbl">Fuerza</span><span class="val" id="vStr">50</span></div>
      <input type="range" id="sStr" min="0" max="100" value="50">
      <div class="row"><span class="lbl">Audio React</span><span class="val" id="vAud">80</span></div>
      <input type="range" id="sAud" min="0" max="100" value="80">
      <div class="row"><span class="lbl">N° Seams</span><span class="val" id="vSea">8</span></div>
      <input type="range" id="sSea" min="1" max="30" value="8">
      <div class="row"><span class="lbl">Smooth</span><span class="val" id="vSmo">40</span></div>
      <input type="range" id="sSmo" min="0" max="100" value="40">
    </div>

    <div class="box">
      <div class="bname">🌊 Eje</div>
      <button class="btn on"  id="bX" onclick="LR.axis('x')">ANCHO (seams vert)</button>
      <button class="btn"     id="bY" onclick="LR.axis('y')">ALTO (seams horiz)</button>
      <button class="btn"     id="bXY" onclick="LR.axis('xy')">AMBOS</button>
    </div>

    <div class="box">
      <div class="bname">🎤 Audio</div>
      <div class="lbl">Micrófono</div>
      <div class="abar-wrap"><div id="abar"></div></div>
    </div>

    <div class="box">
      <div class="bname">👁 Debug</div>
      <button class="btn accent" id="bDbg" onclick="LR.debug()">SEAMS: OFF</button>
    </div>
  </div>
</div>

<video id="rawVid" autoplay playsinline muted style="display:none"></video>

<script>
/* ══════════════════════════════════════════════════════════════════
   LIQUID REACTOR PRO — SEAM CARVING REAL EN TIEMPO REAL
   Pipeline: Cámara → downscale (PW×PH) → luminancia → DP seam
   → REMOVE seams reales → rescale al canvas de salida
   Sin WASM, sin FFmpeg, corre en móvil.
   ══════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

// ── Resolución de trabajo (bajo para ser RT en móvil) ───────────
// Procesa en bajo, renderiza estirado a canvas grande
var PW = 160, PH = 120;

// ── Estado ──────────────────────────────────────────────────────
var axisMode  = 'x';
var showDebug = false;
var smoothAmp = 0;
var fpsF = 0, fpsT = performance.now();

// ── DOM ─────────────────────────────────────────────────────────
var vid     = document.getElementById('rawVid');
var cvOut   = document.getElementById('cvOut');
var cvDbg   = document.getElementById('seamOverlay');
var ctxOut  = cvOut.getContext('2d');
var ctxDbg  = cvDbg.getContext('2d');
var st      = document.getElementById('statusBox');

// ── Canvas de trabajo ────────────────────────────────────────────
var cvCap   = document.createElement('canvas'); cvCap.width=PW; cvCap.height=PH;
var ctxCap  = cvCap.getContext('2d',{willReadFrequently:true});

// Sliders
function sl(id,vid2){
  var el=document.getElementById(id), vl=document.getElementById(vid2);
  el.addEventListener('input',function(){vl.textContent=el.value;});
  return function(){return +el.value;};
}
var gStr = sl('sStr','vStr');
var gAud = sl('sAud','vAud');
var gSea = sl('sSea','vSea');
var gSmo = sl('sSmo','vSmo');

// ── CÁMARA + AUDIO ───────────────────────────────────────────────
function start(){
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true})
  .then(function(s){
    vid.srcObject=s; vid.play();
    st.textContent='✅ ¡ACTIVO! Habla al micrófono 🎤';
    st.className='';
    initAudio(s);
    resize();
    window.addEventListener('resize',resize);
    requestAnimationFrame(loop);
  }).catch(function(e){
    st.className='err';
    st.textContent='❌ '+e.message;
  });
}

function initAudio(s){
  var ac=new AudioContext();
  var src=ac.createMediaStreamSource(s);
  var an=ac.createAnalyser(); an.fftSize=256;
  src.connect(an);
  var buf=new Uint8Array(an.frequencyBinCount);
  (function t(){
    requestAnimationFrame(t);
    an.getByteFrequencyData(buf);
    var sum=0; for(var i=0;i<buf.length;i++) sum+=buf[i];
    var raw=sum/(buf.length*255);
    var r=gAud()/100;
    smoothAmp+=(raw*r-smoothAmp)*0.3;
    document.getElementById('abar').style.width=Math.min(100,smoothAmp*350).toFixed(1)+'%';
  })();
}

function resize(){
  var w=document.getElementById('cvwrap');
  cvOut.width=w.clientWidth; cvOut.height=w.clientHeight;
  cvDbg.width=w.clientWidth; cvDbg.height=w.clientHeight;
}

// ══════════════════════════════════════════════════════════════════
//  LUMINANCIA (CPU — suficiente para 160×120)
// ══════════════════════════════════════════════════════════════════
function luminance(data, w, h){
  var lum = new Uint8Array(w*h);
  for(var i=0,j=0;i<w*h;i++,j+=4){
    // BT.601: 0.299R + 0.587G + 0.114B  → entero rápido
    lum[i] = (data[j]*77 + data[j+1]*150 + data[j+2]*29) >> 8;
  }
  return lum;
}

// ══════════════════════════════════════════════════════════════════
//  DP SEAM CARVING — exactamente como tu videoWorker.js
//  Forward energy para mínimos artefactos
// ══════════════════════════════════════════════════════════════════

// costBuf reutilizable
var _cost = null, _costCap = 0;
var _seam = null, _seamCap = 0;

function ensureInt32(buf, cap, need){
  if(!buf || cap<need) return [new Int32Array(need), need];
  return [buf, cap];
}

/* --- Seam VERTICAL: camino arriba→abajo, mínima energía --- */
function findSeamV(lum, w, h){
  var area = w*h;
  var r = ensureInt32(_cost, _costCap, area); _cost=r[0]; _costCap=r[1];
  var cost = _cost;

  // init fila 0
  for(var x=0;x<w;x++) cost[x]=lum[x];

  var w1=w-1;
  for(var y=1;y<h;y++){
    var row=y*w, prev=(y-1)*w;
    // x=0
    var R0=lum[row+1]|0, L0=lum[row]|0, U0=lum[prev]|0;
    var d0=R0-L0, cV0=d0<0?-d0:d0;
    var m0=cost[prev]+cV0;
    var du0=U0-R0; du0=du0<0?-du0:du0;
    var m01=cost[prev+1]+cV0+du0;
    cost[row]=(m01<m0?m01:m0);

    for(var x=1;x<w1;x++){
      var i=row+x;
      var L=lum[i-1]|0, R=lum[i+1]|0, U=lum[prev+x]|0;
      var d=R-L; var cV=d<0?-d:d;
      var mc=cost[prev+x]+cV;
      var dL=U-L; dL=dL<0?-dL:dL;
      var dR=U-R; dR=dR<0?-dR:dR;
      var m1=cost[prev+x-1]+cV+dL;
      var m2=cost[prev+x+1]+cV+dR;
      if(m1<mc) mc=m1;
      if(m2<mc) mc=m2;
      cost[i]=mc;
    }

    // x=last
    var iL=row+w1;
    var LL=lum[iL-1]|0, RL=lum[iL]|0, UL=lum[prev+w1]|0;
    var dLast=RL-LL; dLast=dLast<0?-dLast:dLast;
    var mL=cost[prev+w1]+dLast;
    var duL=UL-LL; duL=duL<0?-duL:duL;
    var mL1=cost[prev+w1-1]+dLast+duL;
    cost[iL]=(mL1<mL?mL1:mL);
  }

  // backtrack
  var sr=ensureInt32(_seam,_seamCap,h); _seam=sr[0]; _seamCap=sr[1];
  var seam=_seam;
  var minX=0, minC=cost[(h-1)*w];
  for(var x=1;x<w;x++){
    var c=cost[(h-1)*w+x];
    if(c<minC){minC=c;minX=x;}
  }
  seam[h-1]=minX;
  for(var y=h-2;y>=0;y--){
    var x=seam[y+1], r2=y*w;
    var bx=x, mc=cost[r2+x];
    if(x>0 && cost[r2+x-1]<mc){mc=cost[r2+x-1];bx=x-1;}
    if(x<w1 && cost[r2+x+1]<mc) bx=x+1;
    seam[y]=bx;
  }
  return seam;
}

/* --- Seam HORIZONTAL: camino izquierda→derecha --- */
var _costH=null,_costHCap=0,_seamH=null,_seamHCap=0;

function findSeamH(lum, w, h){
  var area=w*h;
  var r=ensureInt32(_costH,_costHCap,area); _costH=r[0]; _costHCap=r[1];
  var cost=_costH;

  // init columna 0
  for(var y=0;y<h;y++) cost[y*w]=lum[y*w];

  var h1=h-1;
  for(var x=1;x<w;x++){
    // y=0
    var i0=x;
    var U0=lum[i0]|0, D0=lum[i0+w]|0, L0=lum[i0-1]|0;
    var d0=D0-U0; d0=d0<0?-d0:d0;
    var m0=cost[i0-1]+d0;
    var dL0=L0-D0; dL0=dL0<0?-dL0:dL0;
    var m01=cost[i0-1+w]+d0+dL0;
    cost[i0]=(m01<m0?m01:m0);

    for(var y=1;y<h1;y++){
      var i=y*w+x;
      var U=lum[i-w]|0, D=lum[i+w]|0, L=lum[i-1]|0;
      var d=D-U; d=d<0?-d:d;
      var mc=cost[i-1]+d;
      var dU=L-U; dU=dU<0?-dU:dU;
      var dD=L-D; dD=dD<0?-dD:dD;
      var m1=cost[i-1-w]+d+dU;
      var m2=cost[i-1+w]+d+dD;
      if(m1<mc) mc=m1;
      if(m2<mc) mc=m2;
      cost[i]=mc;
    }

    // y=last
    var iL=h1*w+x;
    var UL=lum[iL-w]|0, DL=lum[iL]|0, LL=lum[iL-1]|0;
    var dLast=DL-UL; dLast=dLast<0?-dLast:dLast;
    var mL=cost[iL-1]+dLast;
    var duL=LL-UL; duL=duL<0?-duL:duL;
    var mL1=cost[iL-1-w]+dLast+duL;
    cost[iL]=(mL1<mL?mL1:mL);
  }

  var sr=ensureInt32(_seamH,_seamHCap,w); _seamH=sr[0]; _seamHCap=sr[1];
  var seam=_seamH;
  var minY=0, minC=cost[w-1];
  for(var y=1;y<h;y++){
    var c=cost[y*w+w-1];
    if(c<minC){minC=c;minY=y;}
  }
  seam[w-1]=minY;
  var h12=h-1;
  for(var x=w-2;x>=0;x--){
    var y=seam[x+1], ii=y*w+x;
    var by=y, mc=cost[ii];
    if(y>0 && cost[ii-w]<mc){mc=cost[ii-w];by=y-1;}
    if(y<h12 && cost[ii+w]<mc) by=y+1;
    seam[x]=by;
  }
  return seam;
}

// ══════════════════════════════════════════════════════════════════
//  REMOVE seam real de los píxeles RGBA
// ══════════════════════════════════════════════════════════════════

/* Elimina 1 seam vertical → imagen queda (w-1)×h */
function removeSeamV(data, w, h, seam){
  var nw = w-1;
  var next = new Uint8ClampedArray(nw*h*4);
  for(var y=0;y<h;y++){
    var sx=seam[y];
    var o=y*w*4, n=y*nw*4;
    // copia izquierda del seam
    next.set(data.subarray(o, o+sx*4), n);
    // copia derecha
    next.set(data.subarray(o+(sx+1)*4, o+w*4), n+sx*4);
  }
  return next;
}

/* Elimina 1 seam horizontal → imagen queda w×(h-1) */
function removeSeamH(data, w, h, seam){
  var nh=h-1;
  var next=new Uint8ClampedArray(w*nh*4);
  for(var x=0;x<w;x++){
    var sy=seam[x];
    var ny=0;
    for(var y=0;y<h;y++){
      if(y===sy) continue;
      var o=(y*w+x)*4, n=(ny*w+x)*4;
      next[n]=data[o]; next[n+1]=data[o+1];
      next[n+2]=data[o+2]; next[n+3]=data[o+3];
      ny++;
    }
  }
  return next;
}

// ══════════════════════════════════════════════════════════════════
//  SUAVIZADO: promedia columnas/filas del resultado estirado
//  para eliminar la apariencia de "trozos" al rescalar
// ══════════════════════════════════════════════════════════════════
// No necesario si usamos drawImage con interpolación (el canvas ya suaviza)

// ── Buffers reutilizables de seam debug ──────────────────────────
var _lastSeamsV = []; // array de seams verticales para debug
var _lastSeamsH = [];

// ══════════════════════════════════════════════════════════════════
//  LOOP PRINCIPAL
// ══════════════════════════════════════════════════════════════════
function loop(ts){
  requestAnimationFrame(loop);
  if(!vid.videoWidth) return;

  // FPS
  fpsF++;
  if(ts-fpsT>500){
    document.getElementById('fps').textContent=Math.round(fpsF*1000/(ts-fpsT));
    fpsF=0; fpsT=ts;
  }

  var OW=cvOut.width, OH=cvOut.height;
  var str   = gStr()/100;
  var nSeam = Math.round(gSea());
  var smo   = gSmo()/100;

  // 1. Captura low-res
  ctxCap.drawImage(vid, 0, 0, PW, PH);
  var imgd = ctxCap.getImageData(0, 0, PW, PH);
  var data = imgd.data;

  // 2. Magnitud reactiva: cuántos seams eliminar este frame
  //    Cuando smoothAmp es alto (hablas) → más seams → más deformación
  var boost = 1 + smoothAmp * 8;
  var nV = (axisMode==='y') ? 0 : Math.max(1, Math.round(nSeam * str * boost));
  var nH = (axisMode==='x') ? 0 : Math.max(1, Math.round(nSeam * str * boost * 0.5));

  // Clamp: no más del 40% del ancho/alto
  nV = Math.min(nV, Math.floor(PW*0.4));
  nH = Math.min(nH, Math.floor(PH*0.4));

  var curW=PW, curH=PH;
  var pixels = new Uint8ClampedArray(data.buffer.slice(0));

  _lastSeamsV = [];
  _lastSeamsH = [];

  // 3. Eliminar seams VERTICALES (reduce ancho)
  for(var i=0;i<nV;i++){
    var lum = luminance(pixels, curW, curH);
    var seam = findSeamV(lum, curW, curH);
    _lastSeamsV.push(new Int32Array(seam.subarray(0,curH)));
    pixels = removeSeamV(pixels, curW, curH, seam);
    curW--;
  }

  // 4. Eliminar seams HORIZONTALES (reduce alto)
  for(var j=0;j<nH;j++){
    var lum = luminance(pixels, curW, curH);
    var seam = findSeamH(lum, curW, curH);
    _lastSeamsH.push(new Int32Array(seam.subarray(0,curW)));
    pixels = removeSeamH(pixels, curW, curH, seam);
    curH--;
  }

  document.getElementById('dbgW').textContent = curW;
  document.getElementById('dbgS').textContent = nV+'v '+nH+'h';

  // 5. Suavizado temporal (mezcla con frame anterior en canvas)
  //    smo=0 → sin mezcla (máx brutalidad), smo=100 → muy suave
  var alpha = 1 - smo*0.6;

  // 6. Renderiza resultado en canvas de salida
  //    — crea ImageData del resultado comprimido
  //    — lo dibuja en canvas temporal pequeño
  //    — lo estira al canvas de salida (drawImage interpola)
  var cvTmp = document.createElement('canvas');
  cvTmp.width=curW; cvTmp.height=curH;
  var tmpCtx=cvTmp.getContext('2d');
  tmpCtx.putImageData(new ImageData(pixels, curW, curH), 0, 0);

  ctxOut.globalAlpha = alpha;
  ctxOut.clearRect(0,0,OW,OH);
  ctxOut.drawImage(cvTmp, 0, 0, OW, OH);
  ctxOut.globalAlpha = 1;

  // 7. Debug seams
  if(showDebug) drawDebug(OW, OH);
  else ctxDbg.clearRect(0,0,OW,OH);
}

function drawDebug(ow, oh){
  ctxDbg.clearRect(0,0,ow,oh);
  var sx=ow/PW, sy=oh/PH;

  ctxDbg.lineWidth=1;
  ctxDbg.strokeStyle='rgba(0,255,200,.7)';
  for(var i=0;i<_lastSeamsV.length;i++){
    var s=_lastSeamsV[i];
    ctxDbg.beginPath();
    for(var y=0;y<s.length;y++){
      var px=s[y]*sx, py=y*sy;
      y===0?ctxDbg.moveTo(px,py):ctxDbg.lineTo(px,py);
    }
    ctxDbg.stroke();
  }

  ctxDbg.strokeStyle='rgba(255,80,0,.7)';
  for(var j=0;j<_lastSeamsH.length;j++){
    var s=_lastSeamsH[j];
    ctxDbg.beginPath();
    for(var x=0;x<s.length;x++){
      var px=x*sx, py=s[x]*sy;
      x===0?ctxDbg.moveTo(px,py):ctxDbg.lineTo(px,py);
    }
    ctxDbg.stroke();
  }
}

// ── API pública ──────────────────────────────────────────────────
var axisBtns={x:'bX',y:'bY',xy:'bXY'};
window.LR={
  axis:function(m){
    axisMode=m;
    Object.keys(axisBtns).forEach(function(k){
      document.getElementById(axisBtns[k]).classList.toggle('on',k===m);
    });
  },
  debug:function(){
    showDebug=!showDebug;
    var b=document.getElementById('bDbg');
    b.classList.toggle('on',showDebug);
    b.textContent='SEAMS: '+(showDebug?'ON':'OFF');
  }
};

start();
})();
</script>
</body>
</html>
