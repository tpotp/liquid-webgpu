<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LIQUID REACTOR PRO</title>
<style>
:root { --neon:#00ffcc; --bg:#050505; --panel:#0d0d0d; --accent:#ff0055; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background:var(--bg); color:#fff;
  font-family:'Segoe UI',system-ui,sans-serif;
  height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
}
#hdr {
  flex-shrink:0;
  padding:8px 14px;
  border-bottom:1px solid #1a1a1a;
  display:flex; align-items:center; gap:10px;
  background:rgba(0,0,0,.85);
}
#hdr h1 { color:var(--neon); font-size:13px; letter-spacing:3px; text-shadow:0 0 12px var(--neon); }
#hdr .info { font-size:10px; color:#555; margin-left:auto; }
#hdr .info span { color:var(--neon); }

#main { flex:1; display:flex; overflow:hidden; }

#cvwrap {
  flex:1; position:relative; background:#000;
  display:flex; align-items:center; justify-content:center;
}
#cvOut { max-width:100%; max-height:100%; display:block; }

#sidebar {
  width:190px; flex-shrink:0;
  background:var(--panel);
  border-left:1px solid #1a1a1a;
  overflow-y:auto;
  display:flex; flex-direction:column; gap:0;
}

@media (max-width: 600px) {
  #main { flex-direction:column; }
  #sidebar {
    width:100%; height:160px; flex-direction:row;
    border-left:none; border-top:1px solid #1a1a1a;
    overflow-x:auto; overflow-y:hidden;
  }
}

.box {
  padding:10px;
  border-bottom:1px solid #1a1a1a;
  flex-shrink:0;
}
.bname {
  font-size:8px; letter-spacing:2px; color:#444;
  text-transform:uppercase; margin-bottom:8px;
}
.row { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.lbl { font-size:10px; color:#666; }
.val { font-size:10px; color:var(--neon); font-weight:bold; min-width:28px; text-align:right; }
input[type=range] {
  width:100%; height:3px;
  accent-color:var(--neon);
  margin-bottom:8px;
  cursor:pointer;
}

#statusBox {
  font-size:10px; padding:6px 10px;
  background:rgba(0,255,100,.06);
  border:1px solid rgba(0,255,100,.2);
  border-radius:3px; color:#00ff66;
  text-align:center; margin:8px;
}
#statusBox.err { background:rgba(255,30,30,.08); border-color:rgba(255,30,30,.2); color:#ff4455; }
#statusBox.warn { background:rgba(255,200,0,.06); border-color:rgba(255,200,0,.2); color:#ffcc00; }

/* Medidor de audio mejorado con 3 zonas */
.abar-wrap {
  height:8px; background:#111; border-radius:3px;
  overflow:hidden; margin-top:6px; position:relative;
}
.abar-floor {
  position:absolute; top:0; height:100%;
  background: rgba(255,255,0,.25);
  border-right:1px solid rgba(255,255,0,.6);
  pointer-events:none;
}
#abar {
  height:100%; width:0;
  background:linear-gradient(90deg,#00ff88,#00ffcc,var(--accent));
  border-radius:3px;
  transition: width 0.05s;
}
.gate-label {
  font-size:9px; color:#555; margin-top:3px;
  display:flex; justify-content:space-between;
}
.gate-label span { color:#ffcc00; }

/* Indicador de gate activo */
#gateIndicator {
  display:inline-block; width:7px; height:7px;
  border-radius:50%; background:#333;
  margin-right:4px; vertical-align:middle;
  transition:background .1s;
}
#gateIndicator.open { background:#00ff88; box-shadow:0 0 6px #00ff88; }

.btn {
  display:block; width:calc(100% - 20px);
  margin:0 10px 6px;
  padding:7px 6px;
  background:rgba(0,255,204,.08);
  border:1px solid rgba(0,255,204,.25);
  border-radius:4px;
  color:var(--neon); font-size:10px;
  letter-spacing:1px; cursor:pointer;
  transition:background .12s;
}
.btn:hover, .btn.on { background:rgba(0,255,204,.2); color:#fff; }
.btn.accent { border-color:var(--accent); color:var(--accent); }
.btn.accent.on { background:rgba(255,0,85,.2); }

#seamOverlay {
  position:absolute; top:0; left:0; pointer-events:none;
  width:100%; height:100%;
}
</style>
</head>
<body>

<div id="hdr">
  <h1>⚡ LIQUID REACTOR PRO</h1>
  <div class="info">
    FPS: <span id="fps">0</span> &nbsp;
    W: <span id="dbgW">-</span> &nbsp;
    Seams: <span id="dbgS">0</span> &nbsp;
    Gate: <span id="dbgGate">-</span>
  </div>
</div>

<div id="main">
  <div id="cvwrap">
    <canvas id="cvOut"></canvas>
    <canvas id="seamOverlay"></canvas>
  </div>

  <div id="sidebar">
    <div id="statusBox">Iniciando…</div>

    <div class="box">
      <div class="bname">🎛 Deformación</div>
      <div class="row"><span class="lbl">Fuerza base</span><span class="val" id="vStr">50</span></div>
      <input type="range" id="sStr" min="0" max="100" value="50">
      <div class="row"><span class="lbl">Sensibilidad</span><span class="val" id="vAud">75</span></div>
      <input type="range" id="sAud" min="0" max="100" value="75">
      <div class="row"><span class="lbl">N° Seams</span><span class="val" id="vSea">10</span></div>
      <input type="range" id="sSea" min="1" max="30" value="10">
      <div class="row"><span class="lbl">Smooth</span><span class="val" id="vSmo">20</span></div>
      <input type="range" id="sSmo" min="0" max="100" value="20">
    </div>

    <div class="box">
      <div class="bname">🌊 Eje</div>
      <button class="btn on"  id="bX"  onclick="LR.axis('x')">ANCHO (seams vert)</button>
      <button class="btn"     id="bY"  onclick="LR.axis('y')">ALTO (seams horiz)</button>
      <button class="btn"     id="bXY" onclick="LR.axis('xy')">AMBOS</button>
    </div>

    <div class="box">
      <div class="bname">🎤 Audio</div>
      <div class="row">
        <span class="lbl"><span id="gateIndicator"></span>Señal neta</span>
        <span class="val" id="vRaw">0%</span>
      </div>
      <div class="abar-wrap">
        <div class="abar-floor" id="aFloor"></div>
        <div id="abar"></div>
      </div>
      <div class="gate-label">
        ruido: <span id="vFloor">0%</span> &nbsp;|&nbsp; boost: <span id="vBoost">×1</span>
      </div>

      <div style="margin-top:8px">
        <div class="row"><span class="lbl">Umbral gate</span><span class="val" id="vGate">15</span></div>
        <input type="range" id="sGate" min="0" max="60" value="15">
      </div>

      <button class="btn" id="bRecal" onclick="LR.recalibrate()">🔄 RECALIBRAR</button>
    </div>

    <div class="box">
      <div class="bname">👁 Debug</div>
      <button class="btn accent" id="bDbg" onclick="LR.debug()">SEAMS: OFF</button>
    </div>
  </div>
</div>

<video id="rawVid" autoplay playsinline muted style="display:none"></video>

<script>
(function(){
'use strict';

var PW = 160, PH = 120;
var axisMode  = 'x';
var showDebug = false;
var fpsF = 0, fpsT = performance.now();

var vid    = document.getElementById('rawVid');
var cvOut  = document.getElementById('cvOut');
var cvDbg  = document.getElementById('seamOverlay');
var ctxOut = cvOut.getContext('2d');
var ctxDbg = cvDbg.getContext('2d');
var st     = document.getElementById('statusBox');

var cvCap  = document.createElement('canvas'); cvCap.width=PW; cvCap.height=PH;
var ctxCap = cvCap.getContext('2d',{willReadFrequently:true});

function sl(id,vid2){
  var el=document.getElementById(id), vl=document.getElementById(vid2);
  el.addEventListener('input',function(){vl.textContent=el.value;});
  return function(){return +el.value;};
}
var gStr  = sl('sStr','vStr');
var gAud  = sl('sAud','vAud');
var gSea  = sl('sSea','vSea');
var gSmo  = sl('sSmo','vSmo');
var gGate = sl('sGate','vGate');

/* ══════════════════════════════════════════════════════════
   AUDIO ENGINE — con noise gate y respuesta dinámica
   ══════════════════════════════════════════════════════════
   Estrategia:
   1. Medimos el RMS en bandas de VOZ (200–4000 Hz)
   2. Auto-calibramos el piso de ruido ambiente (primer 1.5s)
   3. Gate: si señal <= piso + umbral → 0
   4. Señal neta se eleva con curva cuadrática para que
      al hablar el efecto sea inmediato y dramático
   5. Attack rápido (0.15), release lento (0.05) → golpe real
*/

var smoothAmp   = 0;   // valor final usado por el renderer
var rawLevel    = 0;   // nivel antes del gate (0-1)
var noiseFloor  = 0;   // piso calibrado
var isCalib     = false;
var calibSamples= [];
var calibDone   = false;
var analyser, bufLen, dataArr;
var sampleRate  = 44100;

// índices de las bandas de voz en el array FFT (256 bins)
// se calculan en initAudio cuando sabemos sampleRate
var voiceLow, voiceHigh;

function initAudio(stream){
  var ac  = new AudioContext();
  sampleRate = ac.sampleRate;
  var src = ac.createMediaStreamSource(stream);
  analyser = ac.createAnalyser();
  analyser.fftSize       = 512;   // más resolución frecuencial
  analyser.smoothingTimeConstant = 0.4; // menos suavizado interno → más pico
  bufLen  = analyser.frequencyBinCount; // 256
  dataArr = new Uint8Array(bufLen);
  src.connect(analyser);

  // Bandas de voz: ~200 Hz … 4000 Hz
  var binHz = sampleRate / (analyser.fftSize);
  voiceLow  = Math.max(1, Math.floor(200  / binHz));
  voiceHigh = Math.min(bufLen-1, Math.ceil(4000 / binHz));

  // Calibración automática: tomamos muestras durante 1.5 s
  st.className='warn';
  st.textContent='🔇 Calibrando ruido… silencio por favor';
  isCalib = true;
  calibSamples = [];
  var calibEnd = performance.now() + 1500;

  (function tick(){
    requestAnimationFrame(tick);
    analyser.getByteFrequencyData(dataArr);

    // RMS en banda de voz
    var sum = 0;
    var count = voiceHigh - voiceLow + 1;
    for(var i=voiceLow; i<=voiceHigh; i++){
      var v = dataArr[i]/255;
      sum += v*v;
    }
    rawLevel = Math.sqrt(sum/count);

    if(isCalib && performance.now() < calibEnd){
      calibSamples.push(rawLevel);
    } else if(isCalib){
      isCalib = false;
      calibDone = true;
      // piso = promedio + 0.5 desviaciones estándar
      var avg=0;
      for(var k=0;k<calibSamples.length;k++) avg+=calibSamples[k];
      avg/=calibSamples.length;
      var variance=0;
      for(var k=0;k<calibSamples.length;k++){
        var d=calibSamples[k]-avg; variance+=d*d;
      }
      var std=Math.sqrt(variance/calibSamples.length);
      noiseFloor = avg + std*0.5;
      st.className='';
      st.textContent='✅ ¡ACTIVO! Habla o pon música 🎤';
    }

    // ── Gate + curva de respuesta ────────────────────────
    var gateThresh = noiseFloor + gGate()/1000;  // gGate 0-60 → 0-0.06
    var net = Math.max(0, rawLevel - gateThresh);
    var normalized = Math.min(1, net / Math.max(0.001, 1 - gateThresh));

    // curva cuadrática: respuesta más dramática
    var curved = normalized * normalized;

    // Sensibilidad del usuario (0-100 → ×0 … ×3 extra)
    var sens = gAud() / 100;
    var boosted = Math.min(1, curved * (0.5 + sens * 3.5));

    // Envelope: attack rápido, release más lento
    var attackRate  = 0.35;
    var releaseRate = 0.08;
    var rate = boosted > smoothAmp ? attackRate : releaseRate;
    smoothAmp += (boosted - smoothAmp) * rate;

    // ── UI ───────────────────────────────────────────────
    var pct = (rawLevel*100).toFixed(0);
    var boostVal = (smoothAmp * 25).toFixed(1);  // visual de cuántos seams extra
    document.getElementById('vRaw').textContent   = pct+'%';
    document.getElementById('vBoost').textContent = '×'+(1+parseFloat(boostVal)).toFixed(1);
    document.getElementById('vFloor').textContent = (noiseFloor*100).toFixed(1)+'%';
    document.getElementById('dbgGate').textContent= gateThresh.toFixed(3);
    document.getElementById('abar').style.width   = Math.min(100, boosted*100).toFixed(1)+'%';
    document.getElementById('aFloor').style.width = Math.min(100, (gateThresh / Math.max(0.01,rawLevel||gateThresh)) *
                                                    Math.min(100, rawLevel*100) ).toFixed(1)+'%';
    // Indicador de gate
    var gi = document.getElementById('gateIndicator');
    gi.className = (net > 0.005) ? 'open' : '';
  })();
}

function start(){
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:{
    echoCancellation:false,   // sin cancelación → más señal
    noiseSuppression:false,   // queremos el audio crudo
    autoGainControl:false
  }}).then(function(s){
    vid.srcObject=s; vid.play();
    initAudio(s);
    resize();
    window.addEventListener('resize',resize);
    requestAnimationFrame(loop);
  }).catch(function(e){
    st.className='err';
    st.textContent='❌ '+e.message;
  });
}

function resize(){
  var w=document.getElementById('cvwrap');
  cvOut.width=w.clientWidth; cvOut.height=w.clientHeight;
  cvDbg.width=w.clientWidth; cvDbg.height=w.clientHeight;
}

/* ══════════════════════════════════════════════════════════
   SEAM CARVING
   ══════════════════════════════════════════════════════════ */
function luminance(data, w, h){
  var lum = new Uint8Array(w*h);
  for(var i=0,j=0;i<w*h;i++,j+=4){
    lum[i] = (data[j]*77 + data[j+1]*150 + data[j+2]*29) >> 8;
  }
  return lum;
}

var _cost=null,_costCap=0,_seam=null,_seamCap=0;
function ensureInt32(buf,cap,need){
  if(!buf||cap<need) return [new Int32Array(need),need];
  return [buf,cap];
}

function findSeamV(lum,w,h){
  var area=w*h;
  var r=ensureInt32(_cost,_costCap,area); _cost=r[0]; _costCap=r[1];
  var cost=_cost, w1=w-1;
  for(var x=0;x<w;x++) cost[x]=lum[x];
  for(var y=1;y<h;y++){
    var row=y*w, prev=(y-1)*w;
    var R0=lum[row+1]|0,L0=lum[row]|0,U0=lum[prev]|0;
    var d0=R0-L0; d0=d0<0?-d0:d0;
    var m0=cost[prev]+d0;
    var du0=U0-R0; du0=du0<0?-du0:du0;
    var m01=cost[prev+1]+d0+du0;
    cost[row]=(m01<m0?m01:m0);
    for(var x=1;x<w1;x++){
      var i=row+x, L=lum[i-1]|0, R=lum[i+1]|0, U=lum[prev+x]|0;
      var d=R-L; d=d<0?-d:d;
      var mc=cost[prev+x]+d;
      var dL=U-L; dL=dL<0?-dL:dL;
      var dR=U-R; dR=dR<0?-dR:dR;
      var m1=cost[prev+x-1]+d+dL, m2=cost[prev+x+1]+d+dR;
      if(m1<mc) mc=m1; if(m2<mc) mc=m2;
      cost[i]=mc;
    }
    var iL=row+w1, LL=lum[iL-1]|0, RL=lum[iL]|0, UL=lum[prev+w1]|0;
    var dLast=RL-LL; dLast=dLast<0?-dLast:dLast;
    var mL=cost[prev+w1]+dLast;
    var duL=UL-LL; duL=duL<0?-duL:duL;
    var mL1=cost[prev+w1-1]+dLast+duL;
    cost[iL]=(mL1<mL?mL1:mL);
  }
  var sr=ensureInt32(_seam,_seamCap,h); _seam=sr[0]; _seamCap=sr[1];
  var seam=_seam, minX=0, minC=cost[(h-1)*w];
  for(var x=1;x<w;x++){var c=cost[(h-1)*w+x]; if(c<minC){minC=c;minX=x;}}
  seam[h-1]=minX;
  for(var y=h-2;y>=0;y--){
    var x=seam[y+1], r2=y*w, bx=x, mc=cost[r2+x];
    if(x>0&&cost[r2+x-1]<mc){mc=cost[r2+x-1];bx=x-1;}
    if(x<w1&&cost[r2+x+1]<mc) bx=x+1;
    seam[y]=bx;
  }
  return seam;
}

var _costH=null,_costHCap=0,_seamH=null,_seamHCap=0;
function findSeamH(lum,w,h){
  var area=w*h;
  var r=ensureInt32(_costH,_costHCap,area); _costH=r[0]; _costHCap=r[1];
  var cost=_costH, h1=h-1;
  for(var y=0;y<h;y++) cost[y*w]=lum[y*w];
  for(var x=1;x<w;x++){
    var i0=x, U0=lum[i0]|0, D0=lum[i0+w]|0, L0=lum[i0-1]|0;
    var d0=D0-U0; d0=d0<0?-d0:d0;
    var m0=cost[i0-1]+d0, dL0=L0-D0; dL0=dL0<0?-dL0:dL0;
    var m01=cost[i0-1+w]+d0+dL0;
    cost[i0]=(m01<m0?m01:m0);
    for(var y=1;y<h1;y++){
      var i=y*w+x, U=lum[i-w]|0, D=lum[i+w]|0, L=lum[i-1]|0;
      var d=D-U; d=d<0?-d:d;
      var mc=cost[i-1]+d, dU=L-U; dU=dU<0?-dU:dU;
      var dD=L-D; dD=dD<0?-dD:dD;
      var m1=cost[i-1-w]+d+dU, m2=cost[i-1+w]+d+dD;
      if(m1<mc) mc=m1; if(m2<mc) mc=m2;
      cost[i]=mc;
    }
    var iL=h1*w+x, UL=lum[iL-w]|0, DL=lum[iL]|0, LL=lum[iL-1]|0;
    var dLast=DL-UL; dLast=dLast<0?-dLast:dLast;
    var mL=cost[iL-1]+dLast, duL=LL-UL; duL=duL<0?-duL:duL;
    var mL1=cost[iL-1-w]+dLast+duL;
    cost[iL]=(mL1<mL?mL1:mL);
  }
  var sr=ensureInt32(_seamH,_seamHCap,w); _seamH=sr[0]; _seamHCap=sr[1];
  var seam=_seamH, minY=0, minC=cost[w-1];
  for(var y=1;y<h;y++){var c=cost[y*w+w-1]; if(c<minC){minC=c;minY=y;}}
  seam[w-1]=minY;
  var h12=h-1;
  for(var x=w-2;x>=0;x--){
    var y=seam[x+1], ii=y*w+x, by=y, mc=cost[ii];
    if(y>0&&cost[ii-w]<mc){mc=cost[ii-w];by=y-1;}
    if(y<h12&&cost[ii+w]<mc) by=y+1;
    seam[x]=by;
  }
  return seam;
}

function removeSeamV(data,w,h,seam){
  var nw=w-1, next=new Uint8ClampedArray(nw*h*4);
  for(var y=0;y<h;y++){
    var sx=seam[y], o=y*w*4, n=y*nw*4;
    next.set(data.subarray(o,o+sx*4),n);
    next.set(data.subarray(o+(sx+1)*4,o+w*4),n+sx*4);
  }
  return next;
}

function removeSeamH(data,w,h,seam){
  var nh=h-1, next=new Uint8ClampedArray(w*nh*4);
  for(var x=0;x<w;x++){
    var sy=seam[x], ny=0;
    for(var y=0;y<h;y++){
      if(y===sy) continue;
      var o=(y*w+x)*4, n=(ny*w+x)*4;
      next[n]=data[o]; next[n+1]=data[o+1]; next[n+2]=data[o+2]; next[n+3]=data[o+3];
      ny++;
    }
  }
  return next;
}

var _lastSeamsV=[], _lastSeamsH=[];

/* ══════════════════════════════════════════════════════════
   LOOP PRINCIPAL
   ══════════════════════════════════════════════════════════ */
function loop(ts){
  requestAnimationFrame(loop);
  if(!vid.videoWidth) return;

  fpsF++;
  if(ts-fpsT>500){
    document.getElementById('fps').textContent=Math.round(fpsF*1000/(ts-fpsT));
    fpsF=0; fpsT=ts;
  }

  var OW=cvOut.width, OH=cvOut.height;
  var str   = gStr()/100;
  var nSeam = Math.round(gSea());
  var smo   = gSmo()/100;

  ctxCap.drawImage(vid,0,0,PW,PH);
  var imgd = ctxCap.getImageData(0,0,PW,PH);
  var data = imgd.data;

  /* ── Cálculo de seams con respuesta dramática ──
     smoothAmp ya está normalizado 0–1 con gate aplicado.
     boost: mínimo 1× (sin sonido), hasta 30× (sonido fuerte)
     La curva hace que incluso valores medios de smoothAmp
     generen bastante deformación.
  */
  var audioBoost = 1 + smoothAmp * 28;   // 1× … 29×

  var nV = (axisMode==='y') ? 0
         : Math.max(0, Math.round(nSeam * str * audioBoost));
  var nH = (axisMode==='x') ? 0
         : Math.max(0, Math.round(nSeam * str * audioBoost * 0.5));

  // Sin sonido (gate cerrado) → cero seams, imagen quieta
  if(smoothAmp < 0.005){ nV=0; nH=0; }

  nV = Math.min(nV, Math.floor(PW*0.45));
  nH = Math.min(nH, Math.floor(PH*0.45));

  var curW=PW, curH=PH;
  var pixels=new Uint8ClampedArray(data.buffer.slice(0));
  _lastSeamsV=[]; _lastSeamsH=[];

  for(var i=0;i<nV;i++){
    var lum=luminance(pixels,curW,curH);
    var seam=findSeamV(lum,curW,curH);
    _lastSeamsV.push(new Int32Array(seam.subarray(0,curH)));
    pixels=removeSeamV(pixels,curW,curH,seam);
    curW--;
  }
  for(var j=0;j<nH;j++){
    var lum=luminance(pixels,curW,curH);
    var seam=findSeamH(lum,curW,curH);
    _lastSeamsH.push(new Int32Array(seam.subarray(0,curW)));
    pixels=removeSeamH(pixels,curW,curH,seam);
    curH--;
  }

  document.getElementById('dbgW').textContent=curW;
  document.getElementById('dbgS').textContent=nV+'v '+nH+'h';

  var alpha = 1 - smo*0.65;

  var cvTmp=document.createElement('canvas');
  cvTmp.width=curW; cvTmp.height=curH;
  var tmpCtx=cvTmp.getContext('2d');
  tmpCtx.putImageData(new ImageData(pixels,curW,curH),0,0);

  ctxOut.globalAlpha=alpha;
  ctxOut.clearRect(0,0,OW,OH);
  ctxOut.drawImage(cvTmp,0,0,OW,OH);
  ctxOut.globalAlpha=1;

  if(showDebug) drawDebug(OW,OH);
  else ctxDbg.clearRect(0,0,OW,OH);
}

function drawDebug(ow,oh){
  ctxDbg.clearRect(0,0,ow,oh);
  var sx=ow/PW, sy=oh/PH;
  ctxDbg.lineWidth=1;
  ctxDbg.strokeStyle='rgba(0,255,200,.7)';
  for(var i=0;i<_lastSeamsV.length;i++){
    var s=_lastSeamsV[i]; ctxDbg.beginPath();
    for(var y=0;y<s.length;y++){y===0?ctxDbg.moveTo(s[y]*sx,y*sy):ctxDbg.lineTo(s[y]*sx,y*sy);}
    ctxDbg.stroke();
  }
  ctxDbg.strokeStyle='rgba(255,80,0,.7)';
  for(var j=0;j<_lastSeamsH.length;j++){
    var s=_lastSeamsH[j]; ctxDbg.beginPath();
    for(var x=0;x<s.length;x++){x===0?ctxDbg.moveTo(x*sx,s[x]*sy):ctxDbg.lineTo(x*sx,s[x]*sy);}
    ctxDbg.stroke();
  }
}

/* ── API pública ── */
var axisBtns={x:'bX',y:'bY',xy:'bXY'};
window.LR={
  axis:function(m){
    axisMode=m;
    Object.keys(axisBtns).forEach(function(k){
      document.getElementById(axisBtns[k]).classList.toggle('on',k===m);
    });
  },
  debug:function(){
    showDebug=!showDebug;
    var b=document.getElementById('bDbg');
    b.classList.toggle('on',showDebug);
    b.textContent='SEAMS: '+(showDebug?'ON':'OFF');
  },
  recalibrate:function(){
    if(!analyser) return;
    calibDone=false; isCalib=true; calibSamples=[];
    noiseFloor=0;
    st.className='warn';
    st.textContent='🔇 Calibrando… silencio por favor';
    setTimeout(function(){
      isCalib=false; calibDone=true;
      var avg=0;
      for(var k=0;k<calibSamples.length;k++) avg+=calibSamples[k];
      avg/=Math.max(1,calibSamples.length);
      var variance=0;
      for(var k=0;k<calibSamples.length;k++){var d=calibSamples[k]-avg;variance+=d*d;}
      var std=Math.sqrt(variance/Math.max(1,calibSamples.length));
      noiseFloor=avg+std*0.5;
      st.className=''; st.textContent='✅ ¡ACTIVO! Habla o pon música 🎤';
    },1500);
  }
};

start();
})();
</script>
